[pytest]
testpaths = tests
addopts = -v --strict-markers -m "not ratelimit"
markers =
    smoke: быстрая проверка, что стенд вообще жив
    paywall: доступ к платному контенту
    signup: регистрация нового пользователя
    api: проверки на уровне HTTP, без браузера
    ratelimit: исчерпывает лимит запросов, запускать отдельно
